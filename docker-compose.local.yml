services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  airflow-webserver:
    build: .
    container_name: airflow-webserver
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: super-secret-key-123
      AIRFLOW__LOGGING__LOGGING_LEVEL: DEBUG
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/project

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      SPARK_MASTER_URL: spark://spark-master:7077

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingestion:/opt/project/ingestion
      - ./transformations:/opt/project/transformations
      - ./configs:/opt/project/configs
      - ./sql:/opt/project/sql
      - ./data:/opt/project/data
      - ./logs:/opt/airflow/logs
      - ./loading:/opt/project/loading

    ports:
      - "8082:8080"

    command: webserver

  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    depends_on:
      - postgres

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: super-secret-key-123
      AIRFLOW__LOGGING__LOGGING_LEVEL: DEBUG
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/project

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      SPARK_MASTER_URL: spark://spark-master:7077

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingestion:/opt/project/ingestion
      - ./transformations:/opt/project/transformations
      - ./configs:/opt/project/configs
      - ./sql:/opt/project/sql
      - ./data:/opt/project/data
      - ./logs:/opt/airflow/logs
      - ./loading:/opt/project/loading     
      - ./database:/opt/project/database

    command: scheduler

  spark-master:
    image: apache/spark:latest
    container_name: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      - ./data:/opt/project/data

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker

    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G

    volumes:
      - ./data:/opt/project/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin

    depends_on:
      - postgres

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data: